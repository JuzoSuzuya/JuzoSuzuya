<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30" role="img" aria-label="divider"><title>divider</title><desc>Animated divider</desc><defs><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7AD7F5" stop-opacity="0"/><stop offset=".5" stop-color="#7AD7F5" stop-opacity=".8"/><stop offset="1" stop-color="#7AD7F5" stop-opacity="0"/></linearGradient><linearGradient id="rn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".85" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><clipPath id="dc"><rect x="40" y="0" width="920" height="30"/></clipPath><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter></defs><style>@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes rvx{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}.tw{animation:tw 4s ease-in-out infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.rv{animation:rv .9s cubic-bezier(.2,.8,.2,1) both}.rvx{animation:rvx 1s cubic-bezier(.2,.8,.2,1) both}.spin{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}.spinr{animation:spinr 26s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes run{from{transform:translateX(-80px)}to{transform:translateX(980px)}}.run{animation:run 6s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="40" y="14.5" width="920" height="1" fill="url(#ln)"/><g clip-path="url(#dc)"><rect class="run" x="0" y="13" width="160" height="4" rx="2" fill="url(#rn)" opacity=".9"/></g><path d="M500,3 l12,12 l-12,12 l-12,-12 z" fill="#06101c" stroke="#F5A524" stroke-width="1.8" class="pulse" filter="url(#glow)"/><path d="M500,9 l6,6 l-6,6 l-6,-6 z" fill="#F5A524"/></svg>